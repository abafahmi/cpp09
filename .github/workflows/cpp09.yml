name: CPP09 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4 

      - name: install dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y build-essential python3 valgrind

      - name: run tests
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh

      - name: build ex01
        run: make -C ex01

      - name: run valgrind
        run: |
          valgrind --leak-check=full ./ex01/RPN "3 4 +"
      - name: fclean ex01
        run: make fclean -C ex01    